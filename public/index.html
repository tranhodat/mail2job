<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý Gmail</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📬</text></svg>">
<style>
:root{--bg:#f6f8fc;--card:#fff;--tx:#202124;--mu:#5f6368;--bd:#dadce0;--ac:#0b57d0;--blue:#1a73e8;--amber:#b06000;--green:#188038;--red:#d93025;--vi:#0b57d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Arial,"Segoe UI",sans-serif}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
button,input,textarea{font:inherit;color:var(--tx)}
button{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:disabled{opacity:.6}
input,textarea{width:100%;background:#fff;border:1px solid var(--bd);border-radius:7px;padding:10px 12px}
textarea{min-height:88px;resize:vertical}label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--bg);padding:18px 12px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin:0 12px 24px}.logo .ic{width:27px;height:27px;color:var(--ac)}
aside button{background:transparent;border:0;color:var(--tx);width:100%;padding:11px 16px;border-radius:0 24px 24px 0;justify-content:flex-start}
aside button.on,aside button:hover{background:#d3e3fd;color:#0842a0}
.me{margin-top:auto;font-size:13px;display:flex;gap:8px;align-items:center;padding:8px;background:#e9eef6;border-radius:24px}
.me img{width:30px;height:30px;border-radius:50%}.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.me a{color:var(--mu)}
main{padding:26px clamp(18px,3vw,42px);width:100%;max-width:1480px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}h2{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #2021240d}
.split{display:grid;grid-template-columns:minmax(270px,.78fr) minmax(0,1.55fr);gap:18px;align-items:start}
.inbox-list{padding:6px!important;max-height:calc(100vh - 190px);overflow:auto}
.mail{display:flex;gap:12px;padding:13px 12px;border-radius:7px;cursor:pointer;border-bottom:1px solid #eef0f3}
.mail:hover{background:#f1f3f4}.mail.sel{background:#e8f0fe;border-bottom-color:transparent}
.mail-state{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:#80868b;background:#f1f3f4}
.mail-state .ic{width:15px;height:15px;vertical-align:0}
.mail-state.unread{color:#0b57d0;background:#d3e3fd}
.mail.unread b{font-weight:700}.mail.read b{font-weight:400}
.mail b,.mail small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail small{color:var(--mu)}
.mail>div:not(.mail-state){min-width:0;flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--mu)) 14%,transparent);color:var(--c,var(--mu));margin:2px 4px 2px 0;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
button.stat-filter{width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
button.stat-filter:hover,button.stat-filter.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--card))}
button.stat-filter:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.stat i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.stat b{font-size:20px;display:block;line-height:1.1}.stat span{font-size:12.5px;color:var(--mu)}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--vi));transition:width .5s}
.bar.ok i{background:var(--green)}.bar.er i{background:var(--red)}
.steps{display:flex;justify-content:space-between;gap:4px;margin:12px 0}
.st{flex:1;text-align:center;font-size:12px;color:var(--mu)}.st i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;background:var(--bg);border:2px solid var(--bd)}
.st.d{color:var(--green)}.st.d i{background:color-mix(in srgb,var(--green) 15%,transparent);border-color:var(--green)}.st.cur i{border-color:var(--ac);color:var(--ac)}
.note{background:var(--bg);border-radius:11px;padding:11px 13px;font-size:13.5px;margin-top:10px}
.note h3{font-size:13.5px;margin:0 0 4px;display:flex;gap:6px;align-items:center}
.tl div{padding:3px 0 3px 12px;border-left:2px solid var(--bd)}.tl small{color:var(--mu);margin-right:6px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.task-card{border-top:4px solid #a8c7fa;padding:20px}
.task-card h2{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.task-card h2 .ic{color:var(--ac)}
.file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.file-pick{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);border-radius:7px;padding:8px 12px;color:var(--ac);font-weight:600;cursor:pointer}
.file-pick:hover{background:#f1f3f4}.file-list{display:flex;gap:6px;flex-wrap:wrap}
.file-list .chip{max-width:100%;overflow-wrap:anywhere}
.file-list button{border:0;background:transparent;padding:0;color:inherit}
.task-editor{background:#f8fafd;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-top:12px}
.task-editor textarea{min-height:120px}
.task-editor .file-row{margin-top:10px}
.news-actions{display:flex;justify-content:flex-end;margin-top:10px}
button.save-news{padding:7px;color:var(--mu);border-color:transparent}
button.save-news:hover,button.save-news.saved{color:#b06000;background:#fff8e1}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:500}pre{white-space:pre-wrap;font:inherit;margin:6px 0 0}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px}.seg button{border:0;padding:6px 16px;background:transparent}.seg button.on{background:var(--ac);color:#fff}
.cols{display:flex;gap:8px;align-items:flex-end;height:200px;padding-top:8px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}.col small,.col span{color:var(--mu);font-size:12px}
.stack{display:flex;flex-direction:column-reverse;width:100%;max-width:48px;border-radius:7px 7px 0 0;overflow:hidden;min-height:3px;background:var(--bd)}
.rc{display:flex;align-items:center;gap:8px;padding:5px 0}.rc span{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc .bar{flex:1;margin:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}.login .card{max-width:420px;padding:32px}
.login .big{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
.empty{text-align:center;color:var(--mu);padding:28px}.hide{display:none!important}
.confirm-dialog,.doc-dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 28px);box-shadow:0 12px 42px #20212438;color:var(--tx)}
.confirm-dialog::backdrop,.doc-dialog::backdrop{background:#20212466}
.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--bd)}
.dialog-head h2{margin:0}.dialog-body{padding:20px 22px;overflow:auto}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--bd)}
.doc-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
.doc-category{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#fff;padding:15px 16px}
.doc-category.on{background:#e8f0fe;border-color:var(--ac);color:#174ea6}
.doc-search{max-width:720px;margin-bottom:0}
.doc-table-wrap{overflow:auto;border:1px solid var(--bd);border-radius:9px;background:#fff}
.doc-table{width:100%;border-collapse:collapse;min-width:900px}
.doc-table th,.doc-table td{padding:13px 14px;text-align:left;border-bottom:1px solid #e8eaed;vertical-align:middle}
.doc-table th{background:#f8f9fa;font-size:13px;white-space:nowrap}
.doc-table tbody tr:last-child td{border-bottom:0}
.doc-title{min-width:180px}.doc-files{min-width:260px}.doc-files b{display:block;overflow-wrap:anywhere}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap}.doc-actions button{padding:6px 9px;font-size:12px}
.doc-actions a{display:inline-flex;align-items:center;text-decoration:none;border:1px solid var(--bd);border-radius:7px;padding:6px 9px;color:var(--tx);background:#fff;font-size:12px}
.doc-form label{margin-top:12px}.doc-drop{display:grid;place-items:center;gap:7px;min-height:120px;border:1px dashed #c7cbd1;border-radius:8px;text-align:center;color:var(--mu);cursor:pointer;padding:16px}
.doc-drop.drag{border-color:var(--ac);background:#e8f0fe}.doc-file-list{display:grid;gap:6px;margin-top:10px}
.doc-file-row{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f8f9fa;padding:8px 10px;border-radius:6px;overflow-wrap:anywhere}
@media(max-width:700px){.doc-toolbar{grid-template-columns:1fr}.doc-table-wrap{margin:0 -8px}}
@media(max-width:800px){.app{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;justify-content:space-around;border-top:1px solid var(--bd);background:#fff}
.logo,.me{display:none}aside button{flex-direction:column;gap:2px;font-size:11.5px;padding:7px 4px;align-items:center;justify-content:center}
main{padding:calc(18px + env(safe-area-inset-top)) 14px 90px}.split{grid-template-columns:1fr}.inbox-list{max-height:360px}}
</style></head><body>
<div id="login" class="login hide"><div class="card"><div class="big" data-i="mail"></div><h1>Trợ lý Gmail</h1>
<p class="sub">Đọc thư khi bạn cho phép, tự soạn trả lời, theo dõi tiến độ và điểm tin công nghệ mỗi ngày.</p>
<button class="p" onclick="location='/api/auth/login'"><span data-i="user"></span>Đăng nhập bằng Google</button>
<p class="sub" style="margin-top:14px;font-size:13px">Ứng dụng xin quyền đọc thư, tạo bản nháp và gửi thư khi bạn xác nhận.</p></div></div>
<div id="app" class="app hide">
<aside><div class="logo"><span data-i="mail"></span>Trợ lý Gmail</div>
<button data-v="inbox" class="on"><span data-i="mail"></span>Hộp thư</button>
<button data-v="tasks"><span data-i="list"></span>Công việc</button>
<button data-v="documents"><span data-i="file"></span>Documents</button>
<button data-v="stats"><span data-i="chart"></span>Thống kê</button>
<button data-v="news"><span data-i="news"></span>Tin công nghệ</button>
<div class="me"><img id="pic" alt=""><span id="em"></span><a href="/api/auth/logout" title="Đăng xuất" data-i="out"></a></div></aside>
<main id="main"></main></div><div id="toast" class="toast hide"></div>
<dialog id="send-confirm" class="confirm-dialog"><div class="dialog-head"><h2>Xác nhận gửi thư</h2><button type="button" data-close-send aria-label="Đóng">×</button></div><div class="dialog-body"><p>Bạn có chắc muốn gửi thư này không?</p><div class="note"><b>Người nhận</b><div id="confirm-recipients" style="overflow-wrap:anywhere;margin-top:4px"></div></div></div><div class="dialog-foot"><button type="button" data-close-send>Hủy</button><button type="button" class="p" id="confirm-send-yes">Đồng ý</button></div></dialog>
<dialog id="doc-dialog" class="doc-dialog"></dialog>
<script>
const $=s=>document.querySelector(s);
const I={mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',mailRead:'<path d="m22 7-10 6L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/>',mailUnread:'<path d="M4 5h16a2 2 0 0 1 2 2v1l-10 6L2 8V7a2 2 0 0 1 2-2Z" fill="currentColor" stroke="none"/><path d="M2 8v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8"/>',list:'<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',news:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>',clip:'<path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 0 1 5.6 5.7l-8.5 8.5a2 2 0 0 1-2.9-2.8l8.5-8.5"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',play:'<path d="m6 3 14 9-14 9z"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',plus:'<path d="M12 5v14M5 12h14"/>',spark:'<path d="m12 3 1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',chart:'<path d="M3 3v18h18M7 15v3M12 9v9M17 5v13"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
I.star='<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9z"/>';
I.starFill='<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/>';
const paint=()=>document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=ic(e.dataset.i));
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("vi-VN",{dateStyle:"short",timeStyle:"short"});
const formatBytes=n=>n<1024*1024?`${(n/1024).toFixed(1)} KB`:`${(n/1024/1024).toFixed(1)} MB`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.remove("hide");setTimeout(()=>t.classList.add("hide"),3500)};
async function api(u,o={}){const r=await fetch(u,{method:o.body?"POST":"GET",headers:{"content-type":"application/json"},body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(r.status==401){$("#app").classList.add("hide");$("#login").classList.remove("hide");throw new Error("401")}if(!r.ok)throw new Error(j.error||"Lỗi "+r.status);return j}
const S={mails:[],tasks:[],news:{sources:[],items:[],saved:[]},documents:{items:[]},docCategory:"Văn bản",docSearch:"",docEditId:null,docFiles:[],docKeep:[],docTitle:"",docNumber:"",docCategoryDraft:"Văn bản",sel:null,v:"inbox",newsView:"latest",taskFilter:"all",editTask:null,editTo:"",editReply:"",editKeep:[],editFiles:[]};
const email=f=>(f.match(/<(.+)>/)||[0,f])[1],nm=f=>f.split("<")[0].replace(/"/g,"").trim()||email(f);
function status(t){if(t.completed)return["Hoàn thành","var(--green)"];if(t.error)return["Lỗi","var(--red)"];return[["Đã lên lịch","var(--blue)"],["Đang xử lý","var(--vi)"],["Đang xử lý","var(--vi)"],["Sẵn sàng gửi","var(--blue)"],["Đã gửi","var(--green)"]][t.step]}
const chip=(t,c,i)=>`<span class="chip" style="--c:${c}">${i?ic(i):""}${esc(t)}</span>`;
async function go(v){S.v=v;document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));$("#main").innerHTML='<p class="sub">Đang tải…</p>';
try{if(v=="inbox"){if(!S.mails.length)S.mails=await api("/api/mails");inbox()}if(v=="tasks"){S.tasks=await api("/api/tasks");tasks()}if(v=="documents"){S.documents=await api("/api/documents");documents()}if(v=="stats"){S.tasks=await api("/api/tasks");stats()}if(v=="news"){S.news=await api("/api/news");news()}}catch(e){if(e.message!="401")$("#main").innerHTML=`<div class="card empty">${ic("alert")} ${esc(e.message)}</div>`}}
function inbox(){const m=S.mails.find(x=>x.id==S.sel);let files=[];
$("#main").innerHTML=`<div class="top"><div><h1>Hộp thư</h1><p class="sub">${S.mails.length} thư gần đây</p></div><button id="refresh">${ic("play")}Làm mới</button></div><div class="split"><div class="card inbox-list">${S.mails.map(x=>`<div class="mail ${x.unread?"unread":"read"} ${x.id==S.sel?"sel":""}" data-id="${x.id}"><span class="mail-state ${x.unread?"unread":"read"}" title="${x.unread?"Chưa đọc":"Đã đọc"}">${ic(x.unread?"mailUnread":"mailRead")}</span><div><b>${esc(x.sub)}</b><small>${esc(nm(x.from))} ${x.att.length?"· "+x.att.length+" tệp":""}</small><small>${esc(x.snippet)}</small></div></div>`).join("")||'<div class="empty">Hộp thư trống</div>'}</div>
<div>${m?`<div class="card"><h2>${esc(m.sub)}</h2><div class="sub" style="margin:0 0 8px">${ic("user")} ${esc(m.from)}</div><pre>${esc(m.body||m.snippet)}</pre><div style="margin-top:8px">${m.att.map(a=>chip(a,"var(--blue)","clip")).join("")}</div></div>
<div class="card task-card"><h2>${ic("send")} Soạn thư trả lời</h2><label for="to">Gửi trả lời đến <span style="font-weight:400">(nhiều email ngăn cách bằng dấu phẩy)</span></label><input id="to" type="text" inputmode="email" value="datth@vlute.edu.vn" placeholder="datth@vlute.edu.vn, thdat88@gmail.com"><label for="reply">Nội dung thư</label><textarea id="reply" required placeholder="Nhập nội dung thư trả lời"></textarea><label for="at">Thời điểm gửi <span style="font-weight:400">(để trống = tạo công việc ngay)</span></label><input id="at" type="datetime-local">
<label>Tệp đính kèm <span style="font-weight:400">(tối đa 5 tệp, tổng cộng 3 MB)</span></label><div class="file-row"><label class="file-pick" for="files">${ic("clip")}Chọn tệp</label><input id="files" type="file" multiple class="hide" accept="*/*"><div id="file-list" class="file-list"></div></div>
<div class="acts"><button class="p" id="go">${ic("play")}Tạo công việc</button></div></div>`:`<div class="card empty">${ic("mail")}<br>Chọn một thư bên trái</div>`}</div></div>`;

$("#main").innerHTML=`<div class="top"><div><h1>Điểm tin công nghệ</h1><p class="sub">Theo dõi bài viết mới từ RSS/Atom và website bạn chọn.</p></div><div class="seg"><button data-nview="latest" class="${S.newsView==="latest"?"on":""}">Tin mới</button><button data-nview="saved" class="${S.newsView==="saved"?"on":""}">Tin đã lưu</button></div></div>
<div class="card"><h2>${ic("news")} Nguồn tin</h2><div id="sr">${n.sources.map((s,i)=>`<span class="chip" style="--c:var(--ac)">${esc(s)} <a href="#" data-x="${i}" style="color:inherit;display:inline-flex">${ic("x")}</a></span>`).join("")}</div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="src" placeholder="vd: vnexpress.net/so-hoa"><button id="ad">${ic("plus")}Thêm</button></div>
<div class="acts"><button class="p" id="gn">${ic("news")}Đọc tin mới</button></div></div>
${items.map(i=>{const isSaved=saved.has(i.url);return`<div class="card news-item">${chip(i.tag,TAG[i.tag]||"var(--mu)")}<small style="color:var(--mu)">${esc(i.source)} · ${fmt(i.date)}</small><h2 style="margin-top:6px">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(i.title)}</a>`:esc(i.title)}</h2><div>${esc(i.summary)}</div><div class="news-actions"><button type="button" class="save-news ${isSaved?"saved":""}" data-save-url="${esc(i.url)}" data-saved="${isSaved}" aria-label="${isSaved?"Bỏ lưu bản tin":"Lưu bản tin"}" title="${isSaved?"Bỏ lưu":"Lưu lại"}">${ic(isSaved?"starFill":"star")}</button></div></div>`}).join("")||`<div class="card empty">${ic("news")}<br>${S.newsView==="saved"?"Chưa có tin đã lưu.":"Chưa có bài viết mới. Bấm “Đọc tin mới”."}</div>`}`;
const saveSources=async s=>{S.news=await api("/api/news",{body:{sources:s}});news()};
document.querySelectorAll("[data-nview]").forEach(b=>b.onclick=()=>{S.newsView=b.dataset.nview;news()});
document.querySelectorAll("[data-save-url]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{S.news=await api("/api/news?act=save",{body:{url:b.dataset.saveUrl,saved:b.dataset.saved!=="true"}});news()}catch(e){toast(e.message);b.disabled=false}});
document.querySelectorAll("[data-x]").forEach(a=>a.onclick=e=>{e.preventDefault();saveSources(n.sources.filter((_,i)=>i!=a.dataset.x))});
$("#ad").onclick=()=>{const v=$("#src").value.trim().replace(/^https?:\/\//,"");if(v)saveSources([...n.sources,v]).catch(e=>toast(e.message))};
$("#gn").onclick=async()=>{const b=$("#gn");b.disabled=true;b.textContent="Đang đọc…";try{S.news=await api("/api/news?act=gen",{body:{}});news()}catch(e){toast(e.message);b.disabled=false;b.textContent="Đọc tin mới"}}}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>go(b.dataset.v));
document.querySelectorAll("[data-close-send]").forEach(b=>b.onclick=()=>$("#send-confirm").close());
$("#confirm-send-yes").onclick=async()=>{const b=$("#confirm-send-yes"),id=b.dataset.id;b.disabled=true;try{await api(`/api/tasks?act=send&id=${encodeURIComponent(id)}`,{body:{}});$("#send-confirm").close();toast("Đã gửi thư");go("tasks")}catch(e){toast(e.message)}finally{b.disabled=false}};
(async()=>{paint();try{const me=await api("/api/auth/me");$("#em").textContent=me.name||me.email;if(me.pic)$("#pic").src=me.pic;else $("#pic").classList.add("hide");$("#app").classList.remove("hide");go("inbox")}catch(e){$("#login").classList.remove("hide")}})();
</script></body></html>
